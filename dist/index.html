<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10222b"><meta name="description" content="12개 지역을 여행하는 2D 픽셀 액션 RPG"><title>달바람 연대기 — 열두 조각의 달</title><link rel="stylesheet" href="style.css?v=6"></head><body>

<main><section class="game-shell" aria-label="게임"><div class="viewport"><canvas id="game" width="960" height="600" tabindex="0" aria-label="2D 픽셀 RPG 게임 화면"></canvas><div class="game-top"><div><b id="mapname">달빛 마을</b><small id="mapdesc"></small></div><span id="chapter"></span></div><nav class="screen-menu" aria-label="게임 메뉴">
<details class="menu-group"><summary aria-label="여행 메뉴" title="여행 메뉴"><span aria-hidden="true">▤</span></summary><div class="menu-list"><b>여행</b><button id="journal">의뢰 수첩 <kbd>J</kbd></button><button id="world">세계 지도 <kbd>M</kbd></button></div></details>
<details class="menu-group"><summary aria-label="캐릭터 메뉴" title="캐릭터 메뉴"><span aria-hidden="true">♙</span></summary><div class="menu-list"><b>캐릭터</b><button id="bag">장비 / 가방 <kbd>I</kbd></button><button id="characterstatus">능력치 / 진행 상태</button></div></details>
<details class="menu-group"><summary aria-label="시스템 메뉴" title="시스템 메뉴"><span aria-hidden="true">⚙</span></summary><div class="menu-list"><b>시스템</b><button id="help">조작 안내</button><button id="settings">설정 / 저장 관리</button></div></details></nav>

<section class="quest-hud" aria-label="현재 의뢰"><div class="quest-heading"><h3 id="questtitle"></h3><button id="track" aria-label="퀘스트 목표 표시 전환" title="목표 표시">◆</button></div><p id="quest"></p><small id="questprogress"></small></section>
<div class="status-data" hidden><b>공격 / 방어 <span id="combat"></span></b><p id="equipment"></p><p id="save-status"></p><p id="playtime"></p></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="status-dock"><section class="vitals" aria-label="캐릭터 상태"><div class="vitals-head"><span id="rank">달빛의 여행자</span><b id="level">Lv. 1</b><b id="gold">90냥</b></div><div class="bar-row"><span>HP</span><div class="meter"><i id="hp"></i></div><b id="hptext"></b></div><div class="bar-row"><span>MP</span><div class="meter mp"><i id="mp"></i></div><b id="mptext"></b></div><div class="bar-row xp-row"><span>EXP</span><div class="meter xp"><i id="xp"></i></div><b id="xptext"></b></div></section><div class="consumables"><button id="potion" aria-label="체력약 사용" title="체력약 · 1"><span class="potion-icon hp-potion" aria-hidden="true">✚</span><b id="pots"></b></button><button id="ether" aria-label="기력약 사용" title="기력약 · 2"><span class="potion-icon mp-potion" aria-hidden="true">◆</span><b id="ethers"></b></button></div></div>
<div class="touch"><div class="movement"><button id="joystick" class="joystick" aria-label="원형 이동 조작키 · 원하는 방향으로 드래그"><span class="stick-guides" aria-hidden="true">✥</span><span id="stick-thumb" aria-hidden="true"></span></button></div><div class="combat-controls"><button data-action="attack" id="primary-action" class="attack" aria-label="공격 또는 대화·조사"><span id="actionicon" aria-hidden="true">⚔</span><small id="actiontext">공격</small></button><button id="skill" class="arc-skill" aria-label="달빛베기 사용">☽<small id="skilltext">달빛베기</small></button><button data-action="dash" class="arc-dash" aria-label="회피 돌진">➶<small>회피</small></button></div></div>
<div class="legend">WASD 이동 · SPACE 공격 · Q 기술 · R 회피 · E 조사</div><div class="message"><span id="message">열두 조각의 달이 당신을 기다립니다.</span></div></div></section></main>
<dialog id="dialog"><div class="dialog-heading"><p class="eyebrow" id="speaker"></p><h2 id="dialogtitle"></h2></div><div id="dialogtext"></div><div id="choices"></div><button id="close">닫기 · ESC</button></dialog><input type="file" id="import" accept="application/json" hidden><script src="data.js?v=6"></script><script src="world.js?v=6"></script><script src="renderer.js?v=6"></script><script src="art.js?v=6"></script><script src="game.js?v=6"></script></body></html>
